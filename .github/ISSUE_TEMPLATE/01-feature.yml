name: "✨ 기능 요청 (Feature)"
description: "새 스킬, 새 플러그인, 또는 기존 기능 개선을 제안합니다."
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        파이프라인/스킬 작업의 시작점이 되는 명세이므로 가능한 한 구체적으로 작성한다.

  - type: textarea
    id: background
    attributes:
      label: "배경 / 문제"
      description: "어떤 문제를 해결하나요? 왜 지금 필요한가요?"
      placeholder: "현재 <스킬/플러그인>은 ... 때문에 ... 할 수 없습니다."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: "제안하는 해결 / 기능"
      description: "무엇을 만들거나 바꾸려 하나요?"
    validations:
      required: true

  - type: textarea
    id: user-value
    attributes:
      label: "사용자 가치"
      description: "이 기능이 이 플러그인을 쓰는 프로젝트에 주는 가치/시나리오."
    validations:
      required: false

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: "완료 조건 (Acceptance Criteria)"
      description: "이 작업이 '완료'로 간주되는 검증 가능한 조건 목록."
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: "영향 범위 (scope)"
      description: "해당하는 플러그인을 모두 선택하세요."
      options:
        - label: "gh-issue-flow"
        - label: "community-post-kit"
        - label: "blog-content-pipeline"
        - label: "doc-sync"
        - label: "marketplace.json / 신규 플러그인"

  - type: textarea
    id: references
    attributes:
      label: "참고 자료"
      description: "관련 문서, 사용 예시, 이슈/PR 링크 등."
    validations:
      required: false
