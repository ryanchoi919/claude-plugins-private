name: "🔧 작업 / 잡무 (Chore)"
description: "문서 정리·리팩터링·마켓플레이스 메타데이터 등 비기능 작업을 등록합니다."
title: "[Chore] "
labels: ["chore"]
body:
  - type: markdown
    attributes:
      value: |
        기능 변화가 없는 유지보수성 작업용입니다.

  - type: textarea
    id: task
    attributes:
      label: "작업 내용"
      description: "무엇을 할 것인가."
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: "동기 / 이유"
      description: "왜 필요한가 (일관성, 정리, 마켓플레이스 메타데이터 갱신 등)."
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: "영향 범위 (scope)"
      options:
        - label: "gh-issue-flow"
        - label: "community-post-kit"
        - label: "blog-content-pipeline"
        - label: "doc-sync"
        - label: "marketplace.json / 신규 플러그인"

  - type: textarea
    id: done
    attributes:
      label: "완료 조건"
      description: "이 작업이 완료로 간주되는 조건."
    validations:
      required: false
