name: "🤖 AI 에이전트 작업 (AI Task)"
description: "Claude Code 등 AI 코딩 에이전트에게 위임할 작업을 명세합니다."
title: "[AI] "
labels: ["ai-task"]
body:
  - type: markdown
    attributes:
      value: |
        이 폼은 **에이전트가 그대로 입력으로 사용**합니다. 범위와 검증 방법을 명확히 적을수록
        결과 품질이 올라갑니다.

  - type: textarea
    id: goal
    attributes:
      label: "작업 목표"
      description: "에이전트가 달성해야 할 최종 결과를 한두 문장으로."
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: "컨텍스트 / 관련 파일·문서"
      description: "관련 SKILL.md, 플러그인 디렉토리, 기존 PR/이슈 링크. 에이전트가 어디부터 봐야 하는지."
      placeholder: |
        - plugins/blog-content-pipeline/skills/asset-metadata/SKILL.md
        - plugins/blog-content-pipeline/skills/image-generate/SKILL.md
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: "작업 범위 (In scope / Out of scope)"
      description: "해야 할 것과 하지 말아야 할 것을 명확히 구분."
      placeholder: |
        In scope:
        - ...
        Out of scope:
        - ...
    validations:
      required: true

  - type: textarea
    id: deliverables
    attributes:
      label: "산출물 (Deliverables)"
      description: "변경되거나 새로 생길 SKILL.md/스크립트, 기대 결과물."
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: "검증 방법"
      description: "이 작업이 올바른지 확인하는 방법(다른 세션에서 스킬 실행해보기, diff 리뷰 등)."
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: "제약 / 주의사항"
      description: "지켜야 할 제약(기존 게이트 구조 유지, 특정 플러그인과의 호환성 등)."
    validations:
      required: false
